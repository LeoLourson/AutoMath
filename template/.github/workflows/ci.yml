name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: DeepSeek Harness artifacts
        run: |
          python3 scripts/host/harness.py prepare
          python3 scripts/host/harness.py check
      - name: Project checks
        run: python3 scripts/state/proj.py check
