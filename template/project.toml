# Настройки проекта для скриптов. Правила для агентов — в AGENTS.md и PROJECT.md.

[project]
title = "__TITLE__"
lib = "__LIB__"   # библиотека Lean и пространство имён; то же имя стоит в lakefile.toml

[lean]
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]

[paper]
main = "paper/main.tex"

[sources]
# Хосты, до которых трафик из VPN-туннеля не доходит. К ним scripts/lit.py идёт с адреса
# другого сетевого интерфейса, то есть мимо VPN. Пустой список отключает обход.
direct_hosts = ["mathnet.ru"]
